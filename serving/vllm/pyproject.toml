[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valen-vllm"
version = "0.1.0.dev2"
description = "Valen shared-state decision model and endpoint plugins for vLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["vllm", "pillow", "requests"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.entry-points."vllm.general_plugins"]
valen = "valen_vllm:register"

[project.entry-points."vllm.endpoint_plugins"]
valen = "valen_vllm.endpoint:ValenEndpointPlugin"

[project.scripts]
valen-vllm = "valen_vllm.launch_server:main"

[tool.setuptools.packages.find]
where = ["src"]
