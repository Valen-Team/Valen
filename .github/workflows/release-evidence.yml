name: Release evidence
on:
  push:
    tags: ['p1-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validation/validate_release_report.py --output validation-output/release-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: validation-output/
